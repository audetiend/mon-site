
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon petit univers</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .carte {
            text-align: center;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            animation: apparition 2s ease;
        }

        h1 {
            font-size: 35px;
        }

        p {
            font-size: 18px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: white;
            color: #764ba2;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.1);
        }

        @keyframes apparition {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="carte">
        <h1>✨ Bonjour ! ✨</h1>
        <p>Chaque jour est une nouvelle occasion de briller.</p>
        <button onclick="alert('Tu es extraordinaire ! ❤️')">
            Clique ici
        </button>
    </div>

</body>
</html>
